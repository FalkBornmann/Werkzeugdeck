name: Validate Werkzeugdeck
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check rendered tool designs
        run: node scripts/check-design.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: design-check-screenshots
          path: Archiv/Design-Pruefung/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: werkzeugdeck-pages
          path: dist/
